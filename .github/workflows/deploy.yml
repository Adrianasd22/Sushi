name: Deploy to EC2

on:
  push:
    branches:
      - main  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo chown -R ubuntu:ubuntu /home/ubuntu/sushi
            cd /home/ubuntu/sushi
            git pull origin main

            # Build Angular
            cd /home/ubuntu/sushi/frontend/public-angular/front-angular
            npm install
            npx ng build --configuration production

            # Build React
            cd /home/ubuntu/sushi/frontend/front-react
            npm install
            npm run build

            # Copiar a Apache
            sudo rm -rf /var/www/html/*
            sudo cp -r /home/ubuntu/sushi/frontend/public-angular/front-angular/dist/*/browser/* /var/www/html/
            sudo mkdir -p /var/www/html/admin
            sudo cp -r /home/ubuntu/sushi/frontend/front-react/dist/* /var/www/html/admin/

            sudo systemctl restart apache2