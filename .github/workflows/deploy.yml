name: Deploy to EC2

on:
  push:
    branches:
      - main  

jobs:
  test-angular:
    runs-on: ubuntu-latest

    # Ejecutar test de angular
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/public-angular/front-angular/package-lock.json

      - name: Instalar dependencias Angular
        working-directory: frontend/public-angular/front-angular
        run: npm ci

      - name: Ejecutar tests
        working-directory: frontend/public-angular/front-angular
        run: npx ng test --watch=false --browsers=ChromeHeadless

  deploy:
    runs-on: ubuntu-latest
    needs: test-angular # Si los test de angular pasan, hace el deploy

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo chown -R ubuntu:ubuntu /home/ubuntu/sushi
            cd /home/ubuntu/sushi
            git pull origin main

            # Build Angular
            cd /home/ubuntu/sushi/frontend/public-angular/front-angular
            npm install
            npx ng build --configuration production

            # Build React
            cd /home/ubuntu/sushi/frontend/front-react
            npm install
            npm run build

            # Copiar a Apache
            sudo rm -rf /var/www/html/*
            sudo cp -r /home/ubuntu/sushi/frontend/public-angular/front-angular/dist/*/browser/* /var/www/html/
            sudo mkdir -p /var/www/html/admin
            sudo cp -r /home/ubuntu/sushi/frontend/front-react/dist/* /var/www/html/admin/

            sudo systemctl restart apache2