openapi: 3.0.3

info:
  title: API Sushi Miyu
  version: "1.0.0"
  description: |
    API REST del restaurante Sushi Miyu.
    Permite la gestión de usuarios, autenticación, productos, categorías y pedidos.
    Incluye autenticación con Sanctum y roles de usuario.

servers:
  - url: http://localhost:8080/api
    description: API en Docker local

tags:
  - name: Auth
    description: Registro, login y logout
  - name: Users
    description: Gestión de usuarios (admin)
  - name: Products
    description: Gestión de productos
  - name: Categories
    description: Gestión de categorías
  - name: Orders
    description: Gestión de pedidos
  - name: Misc
    description: Endpoints de prueba y utilidades

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        mensaje:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
        created_at:
          type: string
          format: date-time

    UserCreate:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [admin, worker, user]

    UserRoleUpdate:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, worker, user]

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        mensaje:
          type: string
        access_token:
          type: string
        token_type:
          type: string
        user:
          $ref: '#/components/schemas/User'

    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        price:
          type: number
        category:
          type: string
          nullable: true
        image:
          type: string
          nullable: true

    ProductCreate:
      type: object
      required: [name, description, price, category_id]
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
        category_id:
          type: integer
        image:
          type: string
          nullable: true

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'

    CategoryCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string

    OrderProductItem:
      type: object
      required: [id, quantity]
      properties:
        id:
          type: integer
        quantity:
          type: integer
          minimum: 1

    OrderCreate:
      type: object
      required: [products, phone, mode]
      properties:
        products:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderProductItem'
        phone:
          type: string
        mode:
          type: string
          enum: [pickup, delivery]
        address:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true

    OrderUpdate:
      type: object
      required: [products]
      properties:
        products:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderProductItem'

    Order:
      type: object
      properties:
        id:
          type: integer
        mode:
          type: string
        address:
          type: string
          nullable: true
        phone:
          type: string
        notes:
          type: string
          nullable: true
        total:
          type: number
        status:
          type: string
        user:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            email:
              type: string
        products:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              quantity:
                type: integer
              unit_price:
                type: number
        created_at:
          type: string
          format: date-time

paths:
  /prueba:
    get:
      tags: [Misc]
      summary: Comprobar que la API está funcionando
      responses:
        '200':
          description: Mensaje de prueba
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string

  /register:
    post:
      tags: [Auth]
      summary: Registrar un nuevo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
                  role:
                    type: string
        '400':
          description: Validación incorrecta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /login:
    post:
      tags: [Auth]
      summary: Iniciar sesión y obtener token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /logout:
    post:
      tags: [Auth]
      summary: Cerrar sesión y revocar token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
        '401':
          description: No autorizado

  /products:
    get:
      tags: [Products]
      summary: Listar productos
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Buscar por nombre
        - name: category_id
          in: query
          schema:
            type: integer
          description: Filtrar por categoría
        - name: sort
          in: query
          schema:
            type: string
          description: Ordenar por campo
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
          description: Orden ascendente o descendente
      responses:
        '200':
          description: Lista de productos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

    post:
      tags: [Products]
      summary: Crear producto (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '201':
          description: Producto creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                  data:
                    $ref: '#/components/schemas/Product'
        '403':
          description: No autorizado

  /products/{id}:
    get:
      tags: [Products]
      summary: Obtener producto por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Producto no encontrado

    put:
      tags: [Products]
      summary: Actualizar producto (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '200':
          description: Producto actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                  data:
                    $ref: '#/components/schemas/Product'
        '404':
          description: Producto no encontrado

    delete:
      tags: [Products]
      summary: Eliminar producto (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Producto eliminado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
        '404':
          description: Producto no encontrado

  /categories:
    get:
      tags: [Categories]
      summary: Listar categorías
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: Lista de categorías
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'

    post:
      tags: [Categories]
      summary: Crear categoría (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
      responses:
        '201':
          description: Categoría creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                  data:
                    $ref: '#/components/schemas/Category'

  /categories/{id}:
    get:
      tags: [Categories]
      summary: Obtener categoría por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Categoría encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          description: Categoría no encontrada

    put:
      tags: [Categories]
      summary: Actualizar categoría (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
      responses:
        '200':
          description: Categoría actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          description: Categoría no encontrada

    delete:
      tags: [Categories]
      summary: Eliminar categoría (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Categoría eliminada correctamente

  /categories-with-products:
    get:
      tags: [Categories]
      summary: Obtener categorías con productos
      responses:
        '200':
          description: Lista de categorías con productos incluidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'

  /orders:
    get:
      tags: [Orders]
      summary: Listar todos los pedidos (admin/worker)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de pedidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

    post:
      tags: [Orders]
      summary: Crear pedido (autenticado)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      responses:
        '201':
          description: Pedido creado con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                  data:
                    $ref: '#/components/schemas/Order'

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Obtener pedido por ID (admin/worker)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Pedido no encontrado

    put:
      tags: [Orders]
      summary: Actualizar pedido (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdate'
      responses:
        '200':
          description: Pedido actualizado con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                  data:
                    $ref: '#/components/schemas/Order'
        '404':
          description: Pedido no encontrado

    delete:
      tags: [Orders]
      summary: Eliminar pedido (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pedido eliminado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
        '404':
          description: Pedido no encontrado

  /orders/{order}/status:
    patch:
      tags: [Orders]
      summary: Actualizar estado de pedido (admin/worker)
      security:
        - bearerAuth: []
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pendiente, en_curso, completado, cancelado]
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /my-orders:
    get:
      tags: [Orders]
      summary: Listar pedidos del usuario autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pedidos del usuario
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

  /my-orders/{id}:
    get:
      tags: [Orders]
      summary: Obtener pedido propio por ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Pedido no encontrado

  /users:
    get:
      tags: [Users]
      summary: Listar usuarios (admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

    post:
      tags: [Users]
      summary: Crear usuario (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                  data:
                    $ref: '#/components/schemas/User'

  /users/{id}:
    get:
      tags: [Users]
      summary: Obtener usuario por ID (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Usuario no encontrado

    delete:
      tags: [Users]
      summary: Eliminar usuario (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Usuario eliminado

  /users/{id}/role:
    put:
      tags: [Users]
      summary: Cambiar rol de usuario (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleUpdate'
      responses:
        '200':
          description: Rol actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                  data:
                    $ref: '#/components/schemas/User'
